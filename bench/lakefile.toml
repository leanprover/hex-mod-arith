name = "hex-mod-arith-bench"
defaultTargets = ["hexmodarith_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexModArith"
path = ".."

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_exe]]
name = "hexmodarith_bench"
root = "HexModArith.Bench"
