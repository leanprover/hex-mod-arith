name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libpari-dev pari-gp
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Build library and release regressions
        run: lake build HexModArith
      - name: Build conformance sidecar
        run: |
          cd conformance
          lake build
      - name: Build and verify benchmarks
        env:
          BENCH_VERIFY_HARD_CAP_SECONDS: "360"
        run: |
          cd bench
          lake build hexmodarith_bench
          bash ../scripts/ci/check_bench_verify_budget.sh hexmodarith_bench
      - name: Assert Mathlib-free
        run: |
          if find .lake bench/.lake conformance/.lake -type d -name Mathlib 2>/dev/null | grep -q .; then
            echo "ERROR: a Lake build pulled in Mathlib"; exit 1; fi
          if grep -rqE '^import Mathlib' HexModArith conformance/HexModArith bench/HexModArith 2>/dev/null; then
            echo "ERROR: a source file imports Mathlib"; exit 1; fi
          echo "Mathlib-free OK"
